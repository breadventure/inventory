<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreadVenture — диагностика связи</title>
<style>
  :root{--bg:#F7F5EF;--card:#fff;--text:#1D1D1B;--text2:#6b6b66;--line:#e3e0d8;
        --green:#3B6D11;--red:#A32D2D;--amber:#854F0B}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--text2);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:.5px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
       border-bottom:.5px solid var(--line)}
  .row:last-child{border-bottom:none}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px;background:#c9c6bd}
  .ok .dot{background:var(--green)} .err .dot{background:var(--red)} .warn .dot{background:var(--amber)}
  .label{flex:0 0 150px;font-weight:500}
  .val{flex:1;min-width:0;word-break:break-word;color:var(--text2)}
  .ok .val{color:var(--green)} .err .val{color:var(--red)} .warn .val{color:var(--amber)}
  code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f0ede5;
       padding:1px 5px;border-radius:4px;word-break:break-all}
  button{font:inherit;padding:10px 18px;border-radius:999px;border:.5px solid var(--line);
         background:var(--text);color:#fff;cursor:pointer}
  button.sec{background:transparent;color:var(--text)}
  .verdict{padding:14px 16px;border-radius:10px;margin-top:4px;font-size:14px;display:none}
  .verdict.show{display:block}
  .verdict.good{background:#EAF3DE;color:var(--green)}
  .verdict.bad{background:#FCEBEB;color:var(--red)}
  input{width:100%;padding:9px 11px;border:.5px solid var(--line);border-radius:8px;
        font:12px ui-monospace,Menlo,monospace;background:#fbfaf7;color:var(--text)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Диагностика связи</h1>
  <div class="sub">Проверяет, отвечает ли Apps Script. Ничего не меняет и не сохраняет.</div>

  <div class="card">
    <div style="font-size:13px;font-weight:500;margin-bottom:8px">Адрес развёртывания</div>
    <input id="url" spellcheck="false">
    <div class="actions">
      <button onclick="runAll()">Проверить</button>
      <button class="sec" onclick="useThis()">Прописать этот адрес в приложение</button>
    </div>
  </div>

  <div class="card" id="results">
    <div class="row" id="r-ping"><div class="dot"></div><div class="label">Ответ скрипта</div><div class="val">—</div></div>
    <div class="row" id="r-ver"><div class="dot"></div><div class="label">Версия кода</div><div class="val">—</div></div>
    <div class="row" id="r-pin"><div class="dot"></div><div class="label">Проверка пина</div><div class="val">—</div></div>
    <div class="row" id="r-saved"><div class="dot"></div><div class="label">Адрес в приложении</div><div class="val">—</div></div>
  </div>

  <div class="verdict" id="verdict"></div>
</div>

<script>
const LS_URL = 'bv_script_url';
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbxOUkiD9H4Mt8rYzDydZYV65WomENi7FdsSWERsHvYdB9JD_IInkBOfXv3qaVNs5h-n/exec';

let saved = '';
try { saved = localStorage.getItem(LS_URL) || ''; } catch(e) {}
document.getElementById('url').value = saved || DEFAULT_URL;

function set(id, state, text) {
  const el = document.getElementById(id);
  el.className = 'row ' + state;
  el.querySelector('.val').textContent = text;
}
function verdict(good, text) {
  const v = document.getElementById('verdict');
  v.className = 'verdict show ' + (good ? 'good' : 'bad');
  v.textContent = text;
}

// Тот же JSONP, что в приложении: тег <script>, CORS не участвует.
let seq = 0;
function jsonp(url, params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = '__diag' + (++seq) + '_' + Date.now().toString(36);
    const qs = Object.keys(params)
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    const sc = document.createElement('script');
    let done = false;
    const cleanup = () => {
      if (done) return; done = true;
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      clearTimeout(t);
    };
    const t = setTimeout(() => { cleanup(); reject(new Error('таймаут — скрипт не ответил за 20 секунд')); }, timeoutMs || 20000);
    window[cb] = d => { cleanup(); resolve(d); };
    sc.onerror = () => { cleanup(); reject(new Error('скрипт не отдал ответ (обычно это 400/404 или требование входа в Google)')); };
    sc.src = url + '?' + qs + '&callback=' + cb;
    document.head.appendChild(sc);
  });
}

async function runAll() {
  const url = document.getElementById('url').value.trim();
  document.getElementById('verdict').className = 'verdict';
  ['r-ping','r-ver','r-pin'].forEach(id => set(id, '', 'проверяю...'));
  set('r-saved', '', saved ? saved : 'не задан (используется вшитый)');

  let ping;
  try {
    ping = await jsonp(url, {action: 'ping'});
  } catch (e) {
    set('r-ping', 'err', e.message);
    set('r-ver', 'err', '—');
    set('r-pin', 'err', '—');
    verdict(false,
      'Скрипт не отвечает по этому адресу. Чаще всего это значит, что у развёртывания ' +
      '«Who has access» не Anyone, либо адрес принадлежит удалённому развёртыванию. ' +
      'Откройте этот же адрес с ?action=ping в приватном окне — если просит вход в Google, дело в правах.');
    return;
  }

  set('r-ping', 'ok', 'отвечает: ' + JSON.stringify(ping));

  if (ping.version === 'v5') {
    set('r-ver', 'ok', 'v5 — свежий код на месте');
  } else {
    set('r-ver', 'warn', 'версия не v5. В этом развёртывании старый код — нужен Deploy новой версии.');
  }

  try {
    const pin = await jsonp(url, {action: 'checkPin', pin: '0000', sid: 'diag'});
    if (pin && (pin.error === 'wrong' || pin.role || pin.error === 'blocked')) {
      set('r-pin', 'ok', 'работает (ответ: ' + (pin.error || pin.role) + ')');
      verdict(true, 'Связь в порядке. Нажмите «Прописать этот адрес в приложение» и возвращайтесь на страницу инвентаризации.');
    } else {
      set('r-pin', 'warn', 'странный ответ: ' + JSON.stringify(pin));
      verdict(false, 'Скрипт отвечает, но проверка пина вернула неожиданное. Пришлите этот текст.');
    }
  } catch (e) {
    set('r-pin', 'err', e.message);
    verdict(false, 'ping проходит, а checkPin — нет. Пришлите этот экран.');
  }
}

function useThis() {
  const url = document.getElementById('url').value.trim();
  try {
    localStorage.setItem(LS_URL, url);
    localStorage.setItem('bv_url_migration', 'v5-2026-10-03');
    saved = url;
    set('r-saved', 'ok', 'сохранено: ' + url);
    verdict(true, 'Адрес прописан. Откройте index.html и войдите по пину.');
  } catch (e) {
    verdict(false, 'Не удалось сохранить: ' + e.message);
  }
}

runAll();
</script>
</body>
</html>
